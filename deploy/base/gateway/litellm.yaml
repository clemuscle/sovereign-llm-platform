apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: gateway
spec:
  replicas: 2 # sans état local : quotas dans Redis, clés dans PostgreSQL
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: gateway
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway # réparti si plusieurs nœuds, toléré en mono-nœud
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      containers:
        - name: litellm
          # Variante "-database" : client Prisma pré-généré, aucun téléchargement au démarrage.
          image: ghcr.io/berriai/litellm-database
          args: ["--config", "/app/config/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: litellm-keys, key: MASTER_KEY }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: litellm-db, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://litellm:$(POSTGRES_PASSWORD)@litellm-db:5432/litellm
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: litellm-redis, key: REDIS_PASSWORD }
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True" # pas de téléchargement de la grille tarifaire (mode hors ligne)
            - name: OTEL_EXPORTER
              value: otlp_grpc
            - name: OTEL_ENDPOINT
              value: http://otel-collector.monitoring:4317
            - name: OTEL_SERVICE_NAME
              value: litellm
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
spec:
  minAvailable: 1 # un drain de nœud ne coupe jamais la gateway
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
