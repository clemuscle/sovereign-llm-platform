apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Profil cpu sur un poste de dev (k3s sous WSL2, 15 Go de RAM), déployé sans ArgoCD :
#   kubectl apply -k deploy/overlays/cpu-local --server-side
# Plateforme minimale : cert-manager, Sealed Secrets, kube-prometheus-stack (ni kagent, ni
# Loki / Tempo / OTel Collector), images rag-app et platform-tools construites localement.
resources:
  - namespace.yaml
  - ../../base
  - ../../secrets

components:
  - ../../components/serving-cpu
  - ../../components/model-source-hf
  - ../../components/ingress-traefik
  - ../../components/image-pins
  - ../../components/image-local # après image-pins : remplace les images publiées par la CI

patches:
  # Un seul nœud et peu de RAM : un réplica de chaque service sans état.
  - target: { kind: Deployment, name: litellm }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # OOMKilled au démarrage avec la limite de 1 Gi de la base.
  - target: { kind: Deployment, name: litellm }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
  - target: { kind: Deployment, name: rag-app }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # kagent n'est pas installé : son secret n'a pas de namespace cible.
  - target: { kind: SealedSecret, name: kagent-litellm }
    patch: |-
      $patch: delete
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: kagent-litellm
        namespace: kagent
