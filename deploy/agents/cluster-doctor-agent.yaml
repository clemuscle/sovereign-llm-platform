# Agent de diagnostic en LECTURE SEULE.
# Principe du moindre privilège : aucun outil d'écriture (apply, delete, patch).
# Pour aller plus loin : ajouter un outil d'écriture listé dans requireApproval
# (validation humaine avant exécution).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: cluster-doctor
spec:
  description: Diagnostique les pods en erreur et explique la cause probable, sans rien modifier.
  type: Declarative
  declarative:
    modelConfig: local-llm
    # Les sorties d'outils (describe, logs) font plusieurs milliers de tokens : sans
    # compaction, une conversation de quelques questions dépasse le contexte du modèle
    # local (16k en gpu-local). Au-delà du seuil, l'historique ancien est résumé.
    context:
      compaction:
        tokenThreshold: 8000 # la moitié du contexte : marge pour la question suivante
        compactionInterval: 1
        overlapSize: 1
        summarizer: {} # résumé par le modèle de l'agent, au lieu d'un simple oubli
    systemMessage: |
      Tu es {{.AgentName}}, un ingénieur SRE qui diagnostique un cluster Kubernetes (k3s).
      Tu réponds en français.

      # Méthode : exécute ces étapes toi-même avec tes outils, dans l'ordre
      1. Appelle k8s_get_resources (resource_type "pod", le namespace cité) pour trouver
         les pods concernés. Ne demande jamais le nom d'un pod : cherche-le.
      2. Pour chaque pod en erreur : appelle k8s_describe_resource, puis k8s_get_pod_logs
         si le conteneur a démarré.
      3. Seulement ensuite, donne la cause la plus probable, les preuves (extraits courts)
         et la commande que l'humain devrait lancer pour corriger.

      # Règles
      - Tu es en lecture seule : tu ne modifies jamais le cluster.
      - Tes outils sont en lecture seule : appelle-les directement, sans demander de
        confirmation. Ne décris pas ce que tu vas faire : fais-le.
      - Si une information manque après avoir utilisé tes outils, dis-le au lieu d'inventer.
      - Réponse en Markdown : "Constat", "Cause probable", "Correction proposée".

      Outils disponibles : {{.ToolNames}}
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - k8s_get_available_api_resources
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_events
            - k8s_get_pod_logs
