apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Poste de dev (k3s sous WSL2, un nœud, 15 Go de RAM), déployé sans ArgoCD ni Terraform :
# commun aux overlays cpu-local et gpu-local.
resources:
  - namespace.yaml

patches:
  # Un seul nœud et peu de RAM : un réplica de chaque service sans état.
  - target: { kind: Deployment, name: litellm }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: rag-app }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
