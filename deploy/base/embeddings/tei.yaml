# Serveur d'embeddings (Text Embeddings Inference), sur CPU : toute la VRAM reste au LLM.
# Même schéma que les serveurs de LLM : un initContainer place les poids (révision figée) sur
# le volume, puis le serveur démarre hors ligne sur ce dossier local.
apiVersion: v1
kind: ConfigMap
metadata:
  name: embed-model
data:
  MODEL_REPO: intfloat/multilingual-e5-small
  MODEL_REVISION: PIN_ME # SHA de commit Hugging Face : `make pin`
  ALLOW_PATTERNS: "*.json,*.safetensors,*.txt,sentencepiece.bpe.model,1_Pooling/*"
  MODEL_DIGEST: "" # mode air-gapped : digest de l'artefact OCI (optionnel, renforce la garantie)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: embeddings
  labels:
    app.kubernetes.io/name: embeddings
    app.kubernetes.io/component: embeddings
spec:
  serviceName: embeddings-pods
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embeddings
        app.kubernetes.io/component: embeddings
        llm.platform/model-fetch: "true" # autorise l'accès à la source des poids (NetworkPolicy)
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-model
          image: platform-tools
          envFrom:
            - configMapRef: { name: embed-model }
            - configMapRef: { name: model-source }
          env:
            - name: MODEL_DIR
              value: /data/model
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: HF_TOKEN, optional: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference
          args:
            - --model-id=/data/model # dossier local : aucun accès réseau au démarrage
            - --port=80
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings-pods
  labels:
    app.kubernetes.io/name: embeddings
spec:
  clusterIP: None # service "headless" requis par le StatefulSet
  selector:
    app.kubernetes.io/name: embeddings
  ports:
    - name: http
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  labels:
    app.kubernetes.io/name: embeddings
spec:
  selector:
    app.kubernetes.io/name: embeddings
  ports:
    - name: http
      port: 80
      targetPort: http
