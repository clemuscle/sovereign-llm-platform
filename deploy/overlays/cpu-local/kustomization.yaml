apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Profil cpu sur un poste de dev (k3s sous WSL2, 15 Go de RAM), déployé sans ArgoCD :
#   kubectl apply -k deploy/overlays/cpu-local --server-side
# Plateforme minimale : cert-manager, Sealed Secrets, kube-prometheus-stack, kagent (ni
# Loki / Tempo / OTel Collector), images rag-app et platform-tools construites localement.
resources:
  - ../../base
  - ../../agents
  - ../../secrets

components:
  - ../../components/serving-cpu
  - ../../components/model-source-hf
  - ../../components/model-qwen2.5-7b # appels d'outils pour kagent
  - ../../components/ingress-traefik
  - ../../components/local-single-node
  - ../../components/image-pins
  - ../../components/image-local # après image-pins : remplace les images publiées par la CI
