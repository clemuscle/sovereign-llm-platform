# Valkey (fork open source de Redis, Linux Foundation) : compteurs de quotas partagés entre
# les réplicas LiteLLM. Données éphémères : pas de persistance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-redis
  labels:
    app.kubernetes.io/name: litellm-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-redis
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey
          args: ["valkey-server", "--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: litellm-redis, key: REDIS_PASSWORD }
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-redis
  labels:
    app.kubernetes.io/name: litellm-redis
spec:
  selector:
    app.kubernetes.io/name: litellm-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
