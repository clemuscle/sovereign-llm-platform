# Source unique des versions d'images de la plateforme.
# Les manifests ne référencent que des noms ; version et digest sont fixés ici.
#   - make pin            : ajoute le digest sha256 de chaque image (contenu immuable)
#   - CI (branche main)   : publie rag-app / platform-tools et y inscrit leur nouveau digest
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: rag-app
    newName: ghcr.io/CHANGE_ME/sovereign-llm-platform/rag-app
    newTag: 0.2.0
  - name: platform-tools
    newName: ghcr.io/CHANGE_ME/sovereign-llm-platform/platform-tools
    newTag: 0.2.0
  - name: vllm/vllm-openai
    newTag: v0.32.0
  - name: ghcr.io/ggml-org/llama.cpp
    newTag: server-b11982
  - name: ghcr.io/huggingface/text-embeddings-inference
    newTag: cpu-1.9.4
  - name: ghcr.io/berriai/litellm-database
    newTag: main-v1.83.14-stable
  - name: qdrant/qdrant
    newTag: v1.20.0
  - name: postgres
    newTag: 17-alpine
  - name: valkey/valkey
    newTag: 9.1.3-alpine
