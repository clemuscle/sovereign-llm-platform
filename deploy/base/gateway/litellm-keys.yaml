# Crée / met à jour une clé virtuelle LiteLLM par client (voir gateway/clients.json).
# Hook ArgoCD PostSync : rejoué à chaque synchronisation, sans effet si rien n'a changé.
# Avec `kubectl apply`, il s'exécute une fois puis disparaît (ttlSecondsAfterFinished).
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-keys-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400 # conservé 24 h pour consultation des logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-keys-bootstrap
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: platform-tools
          command: ["python", "/app/bootstrap_keys.py"]
          env:
            - name: LITELLM_URL
              value: http://litellm:4000
            - name: CLIENTS_FILE
              value: /config/clients.json
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: litellm-keys, key: MASTER_KEY }
            - name: RAG_KEY
              valueFrom:
                secretKeyRef: { name: litellm-keys, key: RAG_KEY }
            - name: KAGENT_KEY
              valueFrom:
                secretKeyRef: { name: litellm-keys, key: KAGENT_KEY }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: clients
              mountPath: /config
      volumes:
        - name: clients
          configMap:
            name: litellm-clients
