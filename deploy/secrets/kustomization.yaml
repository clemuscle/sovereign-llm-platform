apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Secrets chiffrés (SealedSecret) de TON cluster, générés par `make seal-secrets`.
# Ils sont commités dans Git : seul le contrôleur Sealed Secrets du cluster peut les déchiffrer.
# Synchronisés avant les workloads (sync-wave -1).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"

resources:
  - kagent-kagent-litellm.yaml
  - llm-litellm-db.yaml
  - llm-litellm-keys.yaml
  - llm-litellm-redis.yaml
  - llm-rag-api-keys.yaml
