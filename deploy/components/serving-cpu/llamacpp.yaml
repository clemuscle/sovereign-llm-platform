apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-model
  namespace: llm
data:
  MODEL_REPO: bartowski/Mistral-7B-Instruct-v0.3-GGUF
  MODEL_REVISION: PIN_ME # SHA de commit Hugging Face : `make pin`
  GGUF_FILE: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
  ALLOW_PATTERNS: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf # un seul fichier parmi les ~20 quantisations du dépôt
  MODEL_DIGEST: ""
  SERVED_MODEL_NAME: llm
  CTX_SIZE: "8192"
  PARALLEL: "2" # requêtes simultanées (le contexte est partagé entre les slots)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llm
  namespace: llm
  labels:
    app.kubernetes.io/name: llamacpp
    app.kubernetes.io/component: serving
spec:
  serviceName: llm-pods
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: llamacpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llamacpp
        app.kubernetes.io/component: serving
        llm.platform/model-fetch: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-model
          image: platform-tools
          envFrom:
            - configMapRef: { name: llm-model }
            - configMapRef: { name: model-source }
          env:
            - name: MODEL_DIR
              value: /models/llm
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: HF_TOKEN, optional: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp
          args:
            - --model=/models/llm/$(GGUF_FILE)
            - --alias=$(SERVED_MODEL_NAME)
            - --ctx-size=$(CTX_SIZE)
            - --parallel=$(PARALLEL)
            - --jinja # template de chat du modèle : nécessaire aux appels d'outils et au JSON contraint
            - --metrics # /metrics au format Prometheus
            - --host=0.0.0.0
            - --port=8000
          envFrom:
            - configMapRef: { name: llm-model }
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: "4", memory: 6Gi }
            limits: { memory: 10Gi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-pods
  namespace: llm
  labels:
    app.kubernetes.io/name: llamacpp
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: llamacpp
  ports:
    - name: http
      port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: llm
  labels:
    app.kubernetes.io/name: llamacpp
    app.kubernetes.io/component: serving
spec:
  selector:
    app.kubernetes.io/name: llamacpp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm
  namespace: llm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llamacpp
      app.kubernetes.io/component: serving
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
